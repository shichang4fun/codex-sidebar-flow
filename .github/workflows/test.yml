name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [20, 22, 24]
        checkout-path: [source, 'source with spaces']
    defaults:
      run:
        working-directory: ${{ matrix.checkout-path }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: ${{ matrix.checkout-path }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm test
      - run: npm run check
      - run: npm run check:desktop
